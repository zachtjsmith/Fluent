name: Description check (temporary)

on:
  push:
    branches: [dev-descriptions]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Workday pace probe
        run: node ingest/tools/workday-probe.mjs
