# Daily collection run, set up the same way as Renewal's: once a day at 06:00
# UTC it runs the tests, collects the listings, checks the site still builds,
# and commits the new board. Your host redeploys when the commit lands.
#
# Scheduled runs start on their own once this file is on the default branch of
# a GitHub repository. Nothing else needs switching on.
name: Refresh job board

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: ingest
        options:
          - ingest
          - ingest-strict
      force:
        description: "Replace the board even if it shrinks by more than half"
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      # Set this repository variable to a contact that reaches you, for example:
      #   FluentJobBoard/1.0 (contact: you@yourdomain.com)
      COLLECTOR_UA: ${{ vars.COLLECTOR_UA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Run the test suite
        run: npm test

      - name: Fetch the open dataset (latest daily snapshot)
        run: git clone --depth 1 https://github.com/Feashliaa/job-board-data /tmp/job-board-data

      # Drops anything older than 60 days, then reads employers' boards directly.
      - name: Pull jobs from the dataset and every employer board
        if: inputs.mode != 'ingest-strict'
        run: npm run ingest -- --snapshot /tmp/job-board-data ${{ inputs.force && '--force' || '' }}

      - name: Pull jobs (salary required)
        if: inputs.mode == 'ingest-strict'
        run: npm run ingest -- --snapshot /tmp/job-board-data --strict ${{ inputs.force && '--force' || '' }}

      - name: Check the site still builds
        run: npm run build

      - name: Publish the new board
        run: |
          git config user.name  "fluent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/jobs.json public/jobs
          if git diff --staged --quiet; then
            echo "No change in listings today."
          else
            COUNT=$(node -p "JSON.parse(require('fs').readFileSync('./public/jobs.json','utf8')).count")
            git commit -m "Board refresh: $COUNT live roles"
            git push
          fi
